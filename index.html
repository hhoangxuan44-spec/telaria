<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* 1. 替换纯黑背景，改为泰拉瑞亚白天天穹渐变色 */
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 云层系统 === */
    .cloud {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      -webkit-transform: translate3d(120vw, 0, 0); 
      z-index: 1; 
    }
    /* 调高了云朵的透明度，让它们在蓝天下更清晰 */
    #c1 {
      top: 10%; height: 10vh; width: 25vw;
      background-image: url('Cummulus_cloud_1.png'); 
      opacity: 0.9;
      -webkit-animation: floatCloud 70s linear infinite;
      -webkit-animation-delay: -10s;
    }
    #c2 {
      top: 25%; height: 12vh; width: 30vw;
      background-image: url('Cummulus_cloud_2.png');
      opacity: 0.85;
      -webkit-animation: floatCloud 90s linear infinite;
      -webkit-animation-delay: -45s;
    }
    #c3 {
      top: 40%; height: 8vh; width: 20vw;
      background-image: url('Cummulus_cloud_3.png');
      opacity: 0.95;
      -webkit-animation: floatCloud 110s linear infinite;
      -webkit-animation-delay: -80s;
    }
    @-webkit-keyframes floatCloud {
      from { -webkit-transform: translate3d(120vw, 0, 0); }
      to   { -webkit-transform: translate3d(-40vw, 0, 0); }
    }

    /* === 蝴蝶群系统 === */
    .butterfly {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 5; 
    }
    #b1 {
      bottom: 20%; left: 10%;
      height: 6vh; width: 15vw;
      background-image: url('Ambience_ButterflySwarm1.gif');
      -webkit-animation: roamLeftRight 40s ease-in-out infinite alternate;
    }
    #b2 {
      bottom: 30%; right: 15%;
      height: 5vh; width: 12vw;
      background-image: url('Ambience_ButterflySwarm2.gif');
      -webkit-animation: roamRightLeft 35s ease-in-out infinite alternate;
    }
    @-webkit-keyframes roamLeftRight {
      from { -webkit-transform: translate3d(0, 0, 0); }
      to   { -webkit-transform: translate3d(30vw, -2vh, 0); }
    }
    @-webkit-keyframes roamRightLeft {
      from { -webkit-transform: translate3d(0, 0, 0); }
      to   { -webkit-transform: translate3d(-30vw, 3vh, 0); }
    }

    /* === 启动交互层 === */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; 
      -webkit-box-pack: center; justify-content: center; 
      -webkit-box-align: center; align-items: center;
      color: white; font-family: "Courier New", Courier, monospace; font-size: 4vw;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <!-- 音乐播放器 -->
  <audio id="bg-music" src="Music-Overworld_Day.mp3" loop></audio>

  <!-- 提示层 -->
  <div id="start-overlay">TAP TO START</div>

  <div id="c1" class="cloud pixelated"></div>
  <div id="c2" class="cloud pixelated"></div>
  <div id="c3" class="cloud pixelated"></div>

  <div id="b1" class="butterfly pixelated"></div>
  <div id="b2" class="butterfly pixelated"></div>

<script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');

    function startExperience() {
      // 针对老版 iOS 必须先 load 再 play 才能解锁音频通道
      music.load();
      music.play();
      overlay.style.display = 'none';
    }

    // 同时绑定 touchstart 和 click，确保 100% 触发
    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>

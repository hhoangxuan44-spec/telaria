<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f2b">
  <title>泰拉瑞亚 · 昼夜生态</title>
  <link rel="icon" href="Category_Old_pet_images/Crimson_Heart_(light_pet)_(pre-1.4.5.0).png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <audio id="bg-music" loop preload="none"></audio>

  <!-- 游戏世界：天空/地形画布 → 生物 → 液体与光效画布 -->
  <div id="stage">
    <canvas id="scene" class="px"></canvas>
    <div id="ents"></div>
    <canvas id="over" class="px"></canvas>
  </div>

  <!-- 泰拉瑞亚风格界面 -->
  <div id="hud">
    <div id="left-col">
      <div id="item-name" class="txt">黎明</div>
      <div id="hotbar"></div>
      <div id="info" class="panel">
        <canvas id="watch" class="px" width="32" height="32"></canvas>
        <div class="info-text">
          <div id="t-big" class="txt">--:--</div>
          <div id="t-sub" class="txt small">第 1 天</div>
        </div>
      </div>
    </div>
    <div id="right-col">
      <div id="life" class="txt small">生命值：400/400</div>
      <div id="hearts"></div>
      <div id="minimap"><canvas id="mm" class="px"></canvas></div>
      <div id="accs" class="txt small">
        <div><img id="moon-ico" class="px" src="Category_Moon_phase_images/Moon-full.png" alt=""><span id="t-moon">月相：满月</span></div>
        <div id="t-mode">现实时间同步</div>
        <div id="t-wind">天气：晴朗</div>
      </div>
    </div>
    <div id="chat"></div>
  </div>

  <div id="start-overlay">
    <div class="start-card">
      <img class="cycle px" src="Category_Moon_phase_images/Moon-phases-cycle.gif" alt="">
      <h1 class="txt">泰拉瑞亚 · 昼夜生态</h1>
      <p class="txt small">真实时钟驱动的日夜循环 · 真实月相 · 动态光照</p>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="start-msg" class="txt">正在加载音乐…</div>
      <button id="mute-btn" class="txt small" type="button">不加载音乐，直接进入</button>
      <p class="txt tip">拖动 / 滑动浏览世界 · 点击生物互动<br>夜里点击坠落之星收集<br>数字键 1-0 或点击物品栏控制时间</p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 全新分层云系统 === */
    .cloud {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 1; 
    }
    /* 高空卷云：极快、半透明 */
    #c-high-1 {
      top: 5%; height: 8vh; width: 18vw;
      background-image: url('Category_Cloud_images/120px-Cirrus_cloud_1.png');
      opacity: 0.6;
      -webkit-animation: floatCloud 30s linear infinite;
    }
    #c-high-2 {
      top: 12%; height: 6vh; width: 15vw;
      background-image: url('Category_Cloud_images/Cirrus_cloud_4.png');
      opacity: 0.7;
      -webkit-animation: floatCloud 45s linear infinite;
      -webkit-animation-delay: -20s;
    }
    /* 中空普通云：中速、较清晰 */
    #c-mid-1 {
      top: 25%; height: 10vh; width: 22vw;
      background-image: url('Category_Cloud_images/120px-Regular_cloud_1.png'); 
      opacity: 0.9;
      -webkit-animation: floatCloud 75s linear infinite;
      -webkit-animation-delay: -10s;
    }
    #c-mid-2 {
      top: 35%; height: 9vh; width: 20vw;
      background-image: url('Category_Cloud_images/120px-Regular_cloud_2.png'); 
      opacity: 0.85;
      -webkit-animation: floatCloud 85s linear infinite;
      -webkit-animation-delay: -50s;
    }
    /* 低空积雨云：巨大、极慢、不透明 */
    #c-low-1 {
      top: 45%; height: 14vh; width: 28vw;
      background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_1.png');
      opacity: 1;
      -webkit-animation: floatCloud 140s linear infinite;
      -webkit-animation-delay: -80s;
    }

    @-webkit-keyframes floatCloud {
      from { -webkit-transform: translate3d(110vw, 0, 0); }
      to   { -webkit-transform: translate3d(-40vw, 0, 0); }
    }

    /* === 加厚版厚实地基 === */
    #ground-container {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; 
      height: 18vh; /* 抬高地基高度（约三个手指） */
      background-color: #5D4037; /* 底部纯实心泥土色 */
      z-index: 3;
    }
    /* 草皮层：只在地基最顶端铺一层 */
    #grass-top {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 32px;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjNUQ0MDM3Ii8+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjQiIGZpbGw9IiM0Q0FGNTAiLz48cmVjdCB4PSIyIiB5PSI0IiB3aWR0aD0iMiIgaGVpZ2h0PSIyIiBmaWxsPSIjNENBRjUwIi8+PHJlY3QgeD0iMTAiIHk9IjQiIHdpZHRoPSI0IiBoZWlnaHQ9IjIiIGZpbGw9IiM0Q0FGNTAiLz48L3N2Zz4=');
      background-repeat: repeat-x; 
      background-size: 32px 32px; 
    }

    /* === 实体层 === */
    .entity {
      position: absolute;
      /* 基础高度：贴着抬高后的地基顶部 */
      bottom: 18vh; 
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 10;
    }
    
    /* 弹吉他的玩家：修复浮空 */
    #player {
      left: 45%; 
      width: 48px; height: 64px; 
      /* 使用负边距将人物“向下压”，抵消 GIF 的透明底部，你可以微调这个数值 */
      margin-bottom: -10px; 
      background-image: url('Category_Player_animations/Guitar_example.gif'); 
    }

    /* 陪伴的兔子 */
    #bunny {
      left: 38%;
      width: 50px; height: 35px;
      margin-bottom: -6px; /* 兔子也微调一下接地 */
      background-image: url('Category_Mount_animations/Bunny_Mount.gif'); 
      -webkit-transform: scaleX(-1); 
      transform: scaleX(-1);
    }

    /* 来回巡逻的猪龙坐骑（利用你抓取的 walking 动图） */
    #pigron {
      width: 80px; height: 60px;
      margin-bottom: -15px; 
      background-image: url('Category_Mount_animations/Pigron_Mount_(walking).gif');
      /* 执行 24 秒一圈的来回走动动画 */
      -webkit-animation: patrolWalk 24s linear infinite;
    }

    /* 巡逻 AI：走到右边 -> 瞬间翻转身体 -> 走回左边 -> 瞬间翻转 */
    @-webkit-keyframes patrolWalk {
      0%   { left: -10%; -webkit-transform: scaleX(1); }
      48%  { left: 110%; -webkit-transform: scaleX(1); } /* 走到屏幕右外侧 */
      50%  { left: 110%; -webkit-transform: scaleX(-1); } /* 瞬间掉头 */
      98%  { left: -10%; -webkit-transform: scaleX(-1); } /* 走回屏幕左外侧 */
      100% { left: -10%; -webkit-transform: scaleX(1); } /* 瞬间掉头完成循环 */
    }

    /* === 启动交互层 === */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; 
      -webkit-box-pack: center; justify-content: center; 
      -webkit-box-align: center; align-items: center;
      color: white; font-family: "Courier New", Courier, monospace; font-size: 4vw;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop></audio>

  <div id="start-overlay">
    LOADING AUDIO...
  </div>

  <!-- 分层云朵组合 -->
  <div id="c-high-1" class="cloud pixelated"></div>
  <div id="c-high-2" class="cloud pixelated"></div>
  <div id="c-mid-1" class="cloud pixelated"></div>
  <div id="c-mid-2" class="cloud pixelated"></div>
  <div id="c-low-1" class="cloud pixelated"></div>

  <!-- 加厚地基 -->
  <div id="ground-container" class="pixelated">
    <div id="grass-top"></div>
  </div>

  <!-- 实体组合 -->
  <div id="player" class="entity pixelated"></div>
  <div id="bunny" class="entity pixelated"></div>
  <div id="pigron" class="entity pixelated"></div>

  <script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');
    var isLoaded = false;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Music-Overworld_Day.m4a', true);
    xhr.responseType = 'blob';
    xhr.onload = function() {
      if (this.status === 200) {
        var objectUrl = URL.createObjectURL(this.response);
        music.src = objectUrl;
        isLoaded = true;
        overlay.innerText = "TAP TO START"; 
      } else {
        overlay.innerText = "ERROR: " + this.status;
      }
    };
    xhr.send();

    function startExperience(e) {
      if (!isLoaded) return; 
      e.preventDefault();
      music.play();
      overlay.style.display = 'none';
    }

    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>

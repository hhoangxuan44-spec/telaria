<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 重构层叠云海 (密集叠加设计) === */
    .cloud {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 1; 
    }
    
    /* 1. 后层云 (慢速、透明度低、最高) */
    #c-bg-1 { top: 8%; height: 12vh; width: 25vw; background-image: url('Category_Cloud_images/120px-Regular_cloud_1.png'); opacity: 0.5; -webkit-animation: floatBg 110s linear infinite; -webkit-animation-delay: -10s; }
    #c-bg-2 { top: 10%; height: 10vh; width: 22vw; background-image: url('Category_Cloud_images/120px-Regular_cloud_2.png'); opacity: 0.6; -webkit-animation: floatBg 110s linear infinite; -webkit-animation-delay: -50s; }
    #c-bg-3 { top: 15%; height: 14vh; width: 28vw; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_1.png'); opacity: 0.55; -webkit-animation: floatBg 110s linear infinite; -webkit-animation-delay: -90s; }

    /* 2. 中层云团 (中速、密集交叉、遮挡) */
    #c-mid-1 { top: 22%; height: 15vh; width: 30vw; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_1.png'); opacity: 0.85; -webkit-animation: floatMid 75s linear infinite; -webkit-animation-delay: -5s; }
    #c-mid-2 { top: 28%; height: 11vh; width: 24vw; background-image: url('Category_Cloud_images/120px-Regular_cloud_1.png'); opacity: 0.9; -webkit-animation: floatMid 75s linear infinite; -webkit-animation-delay: -18s; } /* 紧跟上一朵，形成连云 */
    #c-mid-3 { top: 35%; height: 9vh; width: 20vw; background-image: url('Category_Cloud_images/120px-Cirrus_cloud_1.png'); opacity: 0.8; -webkit-animation: floatMid 75s linear infinite; -webkit-animation-delay: -45s; }
    #c-mid-4 { top: 32%; height: 13vh; width: 26vw; background-image: url('Category_Cloud_images/120px-Regular_cloud_2.png'); opacity: 0.88; -webkit-animation: floatMid 75s linear infinite; -webkit-animation-delay: -65s; }

    /* 3. 前层飞云 (快速、实心、低空) */
    #c-fg-1 { top: 40%; height: 8vh; width: 18vw; background-image: url('Category_Cloud_images/120px-Cirrus_cloud_1.png'); opacity: 1; -webkit-animation: floatFg 45s linear infinite; -webkit-animation-delay: -15s; }
    #c-fg-2 { top: 45%; height: 10vh; width: 22vw; background-image: url('Category_Cloud_images/Cirrus_cloud_4.png'); opacity: 0.95; -webkit-animation: floatFg 45s linear infinite; -webkit-animation-delay: -35s; }

    @-webkit-keyframes floatBg  { from { -webkit-transform: translate3d(110vw, 0, 0); } to { -webkit-transform: translate3d(-50vw, 0, 0); } }
    @-webkit-keyframes floatMid { from { -webkit-transform: translate3d(110vw, 0, 0); } to { -webkit-transform: translate3d(-50vw, 0, 0); } }
    @-webkit-keyframes floatFg  { from { -webkit-transform: translate3d(110vw, 0, 0); } to { -webkit-transform: translate3d(-50vw, 0, 0); } }

    /* === 加厚地基 === */
    #ground-container {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 18vh; background-color: #5D4037; z-index: 3;
    }
    #grass-top {
      position: absolute; top: 0; left: 0; width: 100%; height: 32px;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjNUQ0MDM3Ii8+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjQiIGZpbGw9IiM0Q0FGNTAiLz48cmVjdCB4PSIyIiB5PSI0IiB3aWR0aD0iMiIgaGVpZ2h0PSIyIiBmaWxsPSIjNENBRjUwIi8+PHJlY3QgeD0iMTAiIHk9IjQiIHdpZHRoPSI0IiBoZWlnaHQ9IjIiIGZpbGw9IiM0Q0FGNTAiLz48L3N2Zz4=');
      background-repeat: repeat-x; background-size: 32px 32px; 
    }

    /* === 实体层 === */
    .entity {
      position: absolute; bottom: 18vh; background-repeat: no-repeat; background-size: contain; z-index: 10;
    }
    
    /* 玩家：保持原样 */
    #player {
      left: 55%; width: 48px; height: 64px; margin-bottom: -10px; 
      background-image: url('Category_Player_animations/Guitar_example.gif'); 
    }

    /* 兔子：修复陷地并加入蹦跶 AI */
    #bunny {
      width: 50px; height: 35px;
      margin-bottom: 2px; /* 向上微调，离开泥土 */
      background-image: url('Category_Mount_animations/Bunny_Mount.gif'); 
      -webkit-animation: bunnyHop 14s ease-in-out infinite; /* 绑定水平移动轨迹 */
    }

    /* 猪龙：修复陷地 */
    #pigron {
      width: 80px; height: 60px;
      margin-bottom: 2px; /* 向上微调，离开泥土 */
      background-image: url('Category_Mount_animations/Pigron_Mount_(walking).gif');
      -webkit-animation: patrolWalk 24s linear infinite;
    }

    /* 兔子的不规则移动 AI：左跳 -> 停顿 -> 掉头右跳 -> 停顿 */
    @-webkit-keyframes bunnyHop {
      0%   { left: 45%; -webkit-transform: scaleX(-1); }
      15%  { left: 35%; -webkit-transform: scaleX(-1); }
      20%  { left: 35%; -webkit-transform: scaleX(1); }  /* 迅速掉头 */
      40%  { left: 48%; -webkit-transform: scaleX(1); }
      45%  { left: 48%; -webkit-transform: scaleX(-1); } /* 掉头 */
      60%  { left: 25%; -webkit-transform: scaleX(-1); } /* 跑远一点 */
      70%  { left: 25%; -webkit-transform: scaleX(1); }
      90%  { left: 45%; -webkit-transform: scaleX(1); }
      100% { left: 45%; -webkit-transform: scaleX(-1); }
    }

    /* 猪龙巡逻 AI */
    @-webkit-keyframes patrolWalk {
      0%   { left: -10%; -webkit-transform: scaleX(1); }
      48%  { left: 110%; -webkit-transform: scaleX(1); } 
      50%  { left: 110%; -webkit-transform: scaleX(-1); } 
      98%  { left: -10%; -webkit-transform: scaleX(-1); } 
      100% { left: -10%; -webkit-transform: scaleX(1); } 
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
      color: white; font-family: monospace; font-size: 4vw; letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop></audio>
  <div id="start-overlay">LOADING AUDIO...</div>

  <!-- 10朵云组成的层叠天空 -->
  <div id="c-bg-1" class="cloud pixelated"></div>
  <div id="c-bg-2" class="cloud pixelated"></div>
  <div id="c-bg-3" class="cloud pixelated"></div>
  <div id="c-mid-1" class="cloud pixelated"></div>
  <div id="c-mid-2" class="cloud pixelated"></div>
  <div id="c-mid-3" class="cloud pixelated"></div>
  <div id="c-mid-4" class="cloud pixelated"></div>
  <div id="c-fg-1" class="cloud pixelated"></div>
  <div id="c-fg-2" class="cloud pixelated"></div>

  <div id="ground-container" class="pixelated">
    <div id="grass-top"></div>
  </div>

  <div id="player" class="entity pixelated"></div>
  <div id="bunny" class="entity pixelated"></div>
  <div id="pigron" class="entity pixelated"></div>

  <script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');
    var isLoaded = false;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Music-Overworld_Day.m4a', true);
    xhr.responseType = 'blob';
    xhr.onload = function() {
      if (this.status === 200) {
        var objectUrl = URL.createObjectURL(this.response);
        music.src = objectUrl;
        isLoaded = true;
        overlay.innerText = "TAP TO START"; 
      } else { overlay.innerText = "ERROR: " + this.status; }
    };
    xhr.send();
    function startExperience(e) {
      if (!isLoaded) return; e.preventDefault(); music.play(); overlay.style.display = 'none';
    }
    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* 0层：泰拉瑞亚白天天穹渐变色 */
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 1层：云层系统 === */
    .cloud {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      -webkit-transform: translate3d(120vw, 0, 0); 
      z-index: 1; 
    }
    #c1 {
      top: 10%; height: 10vh; width: 25vw;
      background-image: url('Cummulus_cloud_1.png'); 
      opacity: 0.9;
      -webkit-animation: floatCloud 70s linear infinite;
      -webkit-animation-delay: -10s;
    }
    #c2 {
      top: 25%; height: 12vh; width: 30vw;
      background-image: url('Cummulus_cloud_2.png');
      opacity: 0.85;
      -webkit-animation: floatCloud 90s linear infinite;
      -webkit-animation-delay: -45s;
    }
    #c3 {
      top: 40%; height: 8vh; width: 20vw;
      background-image: url('Cummulus_cloud_3.png');
      opacity: 0.95;
      -webkit-animation: floatCloud 110s linear infinite;
      -webkit-animation-delay: -80s;
    }
    @-webkit-keyframes floatCloud {
      from { -webkit-transform: translate3d(120vw, 0, 0); }
      to   { -webkit-transform: translate3d(-40vw, 0, 0); }
    }

    /* === 2层：流动远景山脉 === */
    #parallax-bg {
      position: absolute;
      bottom: 0; left: 0;
      width: 200%; height: 65%; /* 高度占屏幕中下部 */
      background-image: url('Map_Background_Forest.png'); /* 注意替换你实际抓到的背景图名字 */
      background-repeat: repeat-x; 
      background-size: auto 100%; 
      background-position: bottom left;
      z-index: 2; /* 盖在云朵上，但在蝴蝶和地面之下 */
      -webkit-animation: scrollBg 60s linear infinite;
      animation: scrollBg 60s linear infinite;
    }
    @-webkit-keyframes scrollBg {
      0% { -webkit-transform: translate3d(0, 0, 0); }
      100% { -webkit-transform: translate3d(-50%, 0, 0); }
    }
    @keyframes scrollBg {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* === 3层：实体地面层 === */
    #ground {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 64px; 
      background-image: url('Sand_Block.png'); /* 记得替换为你实际抓到的沙块或草地名字 */
      background-repeat: repeat-x; 
      background-size: 32px auto; 
      z-index: 3; /* 盖住背景图的底边缝隙 */
    }

    /* === 4层：蝴蝶群系统 === */
    .butterfly {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 4; /* 在所有背景之上 */
    }
    #b1 {
      bottom: 20%; left: 10%;
      height: 6vh; width: 15vw;
      background-image: url('Ambience_ButterflySwarm1.gif');
      -webkit-animation: roamLeftRight 40s ease-in-out infinite alternate;
    }
    #b2 {
      bottom: 30%; right: 15%;
      height: 5vh; width: 12vw;
      background-image: url('Ambience_ButterflySwarm2.gif');
      -webkit-animation: roamRightLeft 35s ease-in-out infinite alternate;
    }
    @-webkit-keyframes roamLeftRight {
      from { -webkit-transform: translate3d(0, 0, 0); }
      to   { -webkit-transform: translate3d(30vw, -2vh, 0); }
    }
    @-webkit-keyframes roamRightLeft {
      from { -webkit-transform: translate3d(0, 0, 0); }
      to   { -webkit-transform: translate3d(-30vw, 3vh, 0); }
    }

    /* === 100层：启动交互层 === */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; 
      -webkit-box-pack: center; justify-content: center; 
      -webkit-box-align: center; align-items: center;
      color: white; font-family: "Courier New", Courier, monospace; font-size: 4vw;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop></audio>

  <div id="start-overlay">
    LOADING AUDIO...
  </div>

  <div id="c1" class="cloud pixelated"></div>
  <div id="c2" class="cloud pixelated"></div>
  <div id="c3" class="cloud pixelated"></div>

  <div id="parallax-bg" class="pixelated"></div>
  <div id="ground" class="pixelated"></div>

  <div id="b1" class="butterfly pixelated"></div>
  <div id="b2" class="butterfly pixelated"></div>

  <script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');
    var isLoaded = false;

    // 核心突破：利用 XMLHttpRequest 把音频强制下载到 iPad 内存 (Blob)
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Music-Overworld_Day.m4a', true);
    xhr.responseType = 'blob';
    xhr.onload = function() {
      if (this.status === 200) {
        var objectUrl = URL.createObjectURL(this.response);
        music.src = objectUrl;
        isLoaded = true;
        overlay.innerText = "TAP TO START"; 
      } else {
        overlay.innerText = "ERROR: " + this.status;
      }
    };
    xhr.send();

    function startExperience(e) {
      if (!isLoaded) return; 
      e.preventDefault();
      music.play();
      overlay.style.display = 'none';
    }

    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day Ecosystem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 超级云团系统 (保持之前的厚重感) === */
    .cloud-group { position: absolute; width: 60vw; height: 35vh; z-index: 1; }
    .c-part { position: absolute; background-repeat: no-repeat; background-size: contain; }

    .cg1 { top: 2%; -webkit-animation: floatSys 160s linear infinite; }
    .cg1 .top-spire { top: 0; left: 15%; width: 35vw; height: 22vh; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_1.png'); opacity: 0.9; }
    .cg1 .bot-left  { top: 40%; left: 0; width: 30vw; height: 18vh; background-image: url('Category_Cloud_images/120px-Regular_cloud_1.png'); opacity: 0.95; }
    .cg1 .bot-right { top: 45%; left: 28%; width: 35vw; height: 16vh; background-image: url('Category_Cloud_images/120px-Regular_cloud_2.png'); opacity: 0.85; }

    .cg2 { top: 15%; -webkit-animation: floatSys 130s linear infinite; -webkit-animation-delay: -50s; }
    .cg2 .top-spire { top: 0; left: 10%; width: 30vw; height: 20vh; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_2.png'); opacity: 0.85; }
    .cg2 .bot-left  { top: 45%; left: -5%; width: 28vw; height: 15vh; background-image: url('Category_Cloud_images/120px-Cirrocumulus_cloud_1.png'); opacity: 0.8; }
    .cg2 .bot-right { top: 35%; left: 25%; width: 38vw; height: 18vh; background-image: url('Category_Cloud_images/120px-Cirrocumulus_cloud_2.png'); opacity: 0.9; }

    .cg3 { top: -5%; -webkit-animation: floatSys 190s linear infinite; -webkit-animation-delay: -110s; opacity: 0.7; }
    .cg3 .top-spire { top: 0; left: 20%; width: 32vw; height: 18vh; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_3.png'); }
    .cg3 .bot-left  { top: 30%; left: 5%; width: 25vw; height: 14vh; background-image: url('Category_Cloud_images/120px-Cirrocumulus_cloud_3.png'); }
    .cg3 .bot-right { top: 38%; left: 30%; width: 30vw; height: 15vh; background-image: url('Category_Cloud_images/120px-Regular_cloud_3.png'); }

    .cg4 { top: 25%; -webkit-animation: floatSys 110s linear infinite; -webkit-animation-delay: -15s; }
    .cg4 .top-spire { top: 0; left: 12%; width: 28vw; height: 16vh; background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_4.png'); opacity: 0.9; }
    .cg4 .bot-left  { top: 35%; left: 0; width: 40vw; height: 15vh; background-image: url('Category_Cloud_images/Regular_cloud_4.png'); opacity: 0.95; }

    .cirrus { position: absolute; background-repeat: no-repeat; background-size: contain; z-index: 1; opacity: 0.75; }
    #cir1 { top: 5%; height: 12vh; width: 25vw; background-image: url('Category_Cloud_images/120px-Cirrus_cloud_1.png'); -webkit-animation: floatSys 60s linear infinite; -webkit-animation-delay: -10s; }
    #cir2 { top: 12%; height: 8vh; width: 18vw; background-image: url('Category_Cloud_images/120px-Cirrus_cloud_2.png'); -webkit-animation: floatSys 50s linear infinite; -webkit-animation-delay: -35s; }
    #cir3 { top: 2%; height: 10vh; width: 22vw; background-image: url('Category_Cloud_images/Cirrus_cloud_4.png'); -webkit-animation: floatSys 70s linear infinite; -webkit-animation-delay: -5s; }

    @-webkit-keyframes floatSys { from { -webkit-transform: translate3d(120vw, 0, 0); } to { -webkit-transform: translate3d(-80vw, 0, 0); } }

    /* === 加厚地基 === */
    #ground-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 18vh; background-color: #5D4037; z-index: 3; }
    #grass-top {
      position: absolute; top: 0; left: 0; width: 100%; height: 32px;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjNUQ0MDM3Ii8+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjQiIGZpbGw9IiM0Q0FGNTAiLz48cmVjdCB4PSIyIiB5PSI0IiB3aWR0aD0iMiIgaGVpZ2h0PSIyIiBmaWxsPSIjNENBRjUwIi8+PHJlY3QgeD0iMTAiIHk9IjQiIHdpZHRoPSI0IiBoZWlnaHQ9IjIiIGZpbGw9IiM0Q0FGNTAiLz48L3N2Zz4=');
      background-repeat: repeat-x; background-size: 32px 32px; 
    }

    /* === 繁荣的生态实体层 === */
    .entity {
      position: absolute; bottom: 18vh; background-repeat: no-repeat; background-size: contain; z-index: 10;
    }
    
    /* 1. 弹吉他的玩家1号 (带空气墙补偿) */
    #player1 { left: 45%; width: 48px; height: 64px; margin-bottom: -10px; background-image: url('Category_Player_animations/Guitar_example.gif'); }

    /* 2. 吃东西的玩家2号 (带空气墙补偿，面向左侧) */
    #player2 { 
      left: 70%; width: 48px; height: 64px; margin-bottom: -10px; 
      background-image: url('Category_Player_animations/EatFood_example.gif'); 
      -webkit-transform: scaleX(-1); transform: scaleX(-1);
    }

    /* 3. 原地蹦跶的兔子 */
    #bunny { width: 50px; height: 35px; margin-bottom: 0; background-image: url('Category_Mount_animations/Bunny_Mount.gif'); -webkit-animation: bunnyHop 14s linear infinite; }

    /* 4. 慢速巡逻的猪龙 */
    #pigron { width: 80px; height: 60px; margin-bottom: -10px; background-image: url('Category_Mount_animations/Pigron_Mount_(walking).gif'); -webkit-animation: patrolWalk 28s linear infinite; }

    /* 5. 原地蓄力跳跃的史莱姆 */
    #slime-mount { 
      left: 15%; width: 45px; height: 35px; margin-bottom: 0; 
      background-image: url('Category_Mount_animations/Slime_Mount.gif'); 
      -webkit-animation: slimeJump 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; 
    }

    /* 6. 狂奔掠过的独角兽 */
    #unicorn { width: 70px; height: 50px; margin-bottom: 0; background-image: url('Category_Mount_animations/Unicorn_Mount.gif'); -webkit-animation: unicornDash 15s linear infinite; }

    /* 7. 空中波浪形悬停的蜜蜂 */
    #bee { 
      width: 55px; height: 50px; bottom: 45vh; /* 悬浮在空中 */
      background-image: url('Category_Mount_animations/Bee_Mount_(flying).gif'); 
      -webkit-animation: beeHover 24s ease-in-out infinite; 
    }

    /* === 独立 AI 轨迹关键帧 (全面解决纸片翻转Bug) === */
    
    /* 兔子 AI */
    @-webkit-keyframes bunnyHop {
      0%      { left: 35%; -webkit-transform: scaleX(-1); }
      15%     { left: 25%; -webkit-transform: scaleX(-1); }
      19.99%  { left: 25%; -webkit-transform: scaleX(-1); } 
      20%     { left: 25%; -webkit-transform: scaleX(1); }  
      40%     { left: 38%; -webkit-transform: scaleX(1); }
      44.99%  { left: 38%; -webkit-transform: scaleX(1); }  
      45%     { left: 38%; -webkit-transform: scaleX(-1); } 
      60%     { left: 15%; -webkit-transform: scaleX(-1); }
      69.99%  { left: 15%; -webkit-transform: scaleX(-1); } 
      70%     { left: 15%; -webkit-transform: scaleX(1); }  
      90%     { left: 35%; -webkit-transform: scaleX(1); }
      99.99%  { left: 35%; -webkit-transform: scaleX(1); }  
      100%    { left: 35%; -webkit-transform: scaleX(-1); } 
    }

    /* 猪龙 AI */
    @-webkit-keyframes patrolWalk {
      0%      { left: -15%; -webkit-transform: scaleX(1); }
      49.99%  { left: 115%; -webkit-transform: scaleX(1); } 
      50%     { left: 115%; -webkit-transform: scaleX(-1); } 
      99.99%  { left: -15%; -webkit-transform: scaleX(-1); } 
      100%    { left: -15%; -webkit-transform: scaleX(1); }  
    }

    /* 独角兽极速穿梭 AI */
    @-webkit-keyframes unicornDash {
      0%      { left: -25%; -webkit-transform: scaleX(1); }
      49.99%  { left: 125%; -webkit-transform: scaleX(1); } 
      50%     { left: 125%; -webkit-transform: scaleX(-1); } 
      99.99%  { left: -25%; -webkit-transform: scaleX(-1); } 
      100%    { left: -25%; -webkit-transform: scaleX(1); }  
    }

    /* 史莱姆垂直物理蓄力跳跃 */
    @-webkit-keyframes slimeJump {
      0%, 75%, 100% { -webkit-transform: translateY(0); } /* 在地上待着 */
      85% { -webkit-transform: translateY(-80px); } /* 突然起跳 */
    }

    /* 蜜蜂空中正弦波巡航 AI */
    @-webkit-keyframes beeHover {
      0%      { left: -20%; -webkit-transform: scaleX(-1) translateY(0); }
      25%     { -webkit-transform: scaleX(-1) translateY(-40px); } /* 向上浮动 */
      49.99%  { left: 120%; -webkit-transform: scaleX(-1) translateY(0); } 
      50%     { left: 120%; -webkit-transform: scaleX(1) translateY(0); } /* 飞出屏幕右侧掉头 */
      75%     { -webkit-transform: scaleX(1) translateY(30px); } /* 向下浮动 */
      99.99%  { left: -20%; -webkit-transform: scaleX(1) translateY(0); } 
      100%    { left: -20%; -webkit-transform: scaleX(-1) translateY(0); } /* 飞出屏幕左侧掉头 */
    }

    /* 启动界面 */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; -webkit-box-pack: center; justify-content: center; -webkit-box-align: center; align-items: center;
      color: white; font-family: monospace; font-size: 4vw; letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop></audio>
  <div id="start-overlay">LOADING AUDIO...</div>

  <!-- 宏大的云层系统 -->
  <div class="cloud-group cg1 pixelated"><div class="c-part top-spire"></div><div class="c-part bot-left"></div><div class="c-part bot-right"></div></div>
  <div class="cloud-group cg2 pixelated"><div class="c-part top-spire"></div><div class="c-part bot-left"></div><div class="c-part bot-right"></div></div>
  <div class="cloud-group cg3 pixelated"><div class="c-part top-spire"></div><div class="c-part bot-left"></div><div class="c-part bot-right"></div></div>
  <div class="cloud-group cg4 pixelated"><div class="c-part top-spire"></div><div class="c-part bot-left"></div></div>
  <div id="cir1" class="cirrus pixelated"></div><div id="cir2" class="cirrus pixelated"></div><div id="cir3" class="cirrus pixelated"></div>

  <!-- 坚实大地 -->
  <div id="ground-container" class="pixelated"><div id="grass-top"></div></div>

  <!-- 繁荣生态全员上阵 -->
  <div id="player1" class="entity pixelated"></div>
  <div id="player2" class="entity pixelated"></div>
  <div id="bunny" class="entity pixelated"></div>
  <div id="pigron" class="entity pixelated"></div>
  <div id="unicorn" class="entity pixelated"></div>
  <div id="slime-mount" class="entity pixelated"></div>
  <div id="bee" class="entity pixelated"></div>

  <script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');
    var isLoaded = false;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'Music-Overworld_Day.m4a', true);
    xhr.responseType = 'blob';
    xhr.onload = function() {
      if (this.status === 200) {
        var objectUrl = URL.createObjectURL(this.response);
        music.src = objectUrl;
        isLoaded = true;
        overlay.innerText = "TAP TO START"; 
      } else { overlay.innerText = "ERROR: " + this.status; }
    };
    xhr.send();
    function startExperience(e) {
      if (!isLoaded) return; e.preventDefault(); music.play(); overlay.style.display = 'none';
    }
    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>

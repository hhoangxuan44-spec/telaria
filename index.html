<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Terraria Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* === 极简纯粹的天空渐变 === */
    html, body { 
      width: 100%; height: 100%; 
      background: -webkit-linear-gradient(top, #5c94fc 0%, #a8d8fc 100%);
      overflow: hidden; 
    }
    
    .pixelated {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* === 自然云层系统 (直接调用文件夹里的普通云) === */
    .cloud {
      position: absolute;
      background-repeat: no-repeat;
      background-size: contain;
      -webkit-transform: translate3d(120vw, 0, 0); 
      z-index: 1; 
    }
    #c1 {
      top: 10%; height: 10vh; width: 20vw;
      background-image: url('Category_Cloud_images/120px-Regular_cloud_1.png'); 
      opacity: 0.9;
      -webkit-animation: floatCloud 70s linear infinite;
      -webkit-animation-delay: -10s;
    }
    #c2 {
      top: 25%; height: 8vh; width: 25vw;
      background-image: url('Category_Cloud_images/120px-Cirrus_cloud_1.png');
      opacity: 0.85;
      -webkit-animation: floatCloud 90s linear infinite;
      -webkit-animation-delay: -45s;
    }
    #c3 {
      top: 40%; height: 12vh; width: 22vw;
      background-image: url('Category_Cloud_images/120px-Cumulonimbus_cloud_1.png');
      opacity: 0.95;
      -webkit-animation: floatCloud 110s linear infinite;
      -webkit-animation-delay: -80s;
    }
    @-webkit-keyframes floatCloud {
      from { -webkit-transform: translate3d(120vw, 0, 0); }
      to   { -webkit-transform: translate3d(-40vw, 0, 0); }
    }

    /* === Base64 无缝像素草地 (完美平铺不失真) === */
    #ground {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; 
      height: 64px; 
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjNUQ0MDM3Ii8+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjQiIGZpbGw9IiM0Q0FGNTAiLz48cmVjdCB4PSIyIiB5PSI0IiB3aWR0aD0iMiIgaGVpZ2h0PSIyIiBmaWxsPSIjNENBRjUwIi8+PHJlY3QgeD0iMTAiIHk9IjQiIHdpZHRoPSI0IiBoZWlnaHQ9IjIiIGZpbGw9IiM0Q0FGNTAiLz48L3N2Zz4=');
      background-repeat: repeat-x; 
      background-size: 32px 32px; 
      z-index: 3;
    }

    /* === 实体层：玩家与动物 === */
    .entity {
      position: absolute;
      bottom: 64px; /* 刚好坐在 64px 高的草地上 */
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 10;
    }
    
    /* 弹吉他的玩家 */
    #player {
      left: 45%; 
      width: 48px; height: 64px; /* 调整高度比例匹配玩家模型 */
      background-image: url('Category_Player_animations/Guitar_example.gif'); 
    }

    /* 旁边陪伴的兔子 */
    #bunny {
      left: 35%;
      width: 50px; height: 35px;
      background-image: url('Category_Mount_animations/Bunny_Mount.gif'); 
      -webkit-transform: scaleX(-1); /* 让兔子翻转朝向右边的玩家 */
      transform: scaleX(-1);
    }

    /* === 启动交互层 === */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); z-index: 100;
      display: -webkit-box; display: flex; 
      -webkit-box-pack: center; justify-content: center; 
      -webkit-box-align: center; align-items: center;
      color: white; font-family: "Courier New", Courier, monospace; font-size: 4vw;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop></audio>

  <div id="start-overlay">
    LOADING AUDIO...
  </div>

  <!-- 天空云朵 -->
  <div id="c1" class="cloud pixelated"></div>
  <div id="c2" class="cloud pixelated"></div>
  <div id="c3" class="cloud pixelated"></div>

  <!-- 地基 -->
  <div id="ground" class="pixelated"></div>

  <!-- 实体组合 -->
  <div id="player" class="entity pixelated"></div>
  <div id="bunny" class="entity pixelated"></div>

  <script>
    var overlay = document.getElementById('start-overlay');
    var music = document.getElementById('bg-music');
    var isLoaded = false;

    var xhr = new XMLHttpRequest();
    // 依然读取根目录下的背景音乐
    xhr.open('GET', 'Music-Overworld_Day.m4a', true);
    xhr.responseType = 'blob';
    xhr.onload = function() {
      if (this.status === 200) {
        var objectUrl = URL.createObjectURL(this.response);
        music.src = objectUrl;
        isLoaded = true;
        overlay.innerText = "TAP TO START"; 
      } else {
        overlay.innerText = "ERROR: " + this.status;
      }
    };
    xhr.send();

    function startExperience(e) {
      if (!isLoaded) return; 
      e.preventDefault();
      music.play();
      overlay.style.display = 'none';
    }

    overlay.addEventListener('touchstart', startExperience, false);
    overlay.addEventListener('click', startExperience, false);
  </script>
</body>
</html>
